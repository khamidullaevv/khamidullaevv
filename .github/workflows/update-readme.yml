name: Update Profile README

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "readme.source.md"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install satori --no-save

      - name: Generate SVG cards
        env:
          GH_USERNAME: khamidullaevv
          GH_TOKEN: ${{ secrets.STATS_TOKEN }}
          OUT_DIR: assets
        run: node scripts/generate-cards.mjs

      - name: Build README.md from source
        run: node scripts/build-readme.mjs

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets README.md
          git diff --cached --quiet && echo "No changes" || git commit -m "chore: refresh profile cards"
          git push